version: 1

name: fastify-next
description: Fastify API + Next.js

requirements:
  - command: git
  - command: node
    version: ">=24"
  - command: pnpm
    when:
      variable: package_manager
      equals: pnpm

variables:
  database:
    type: select
    default: postgres
    options:
      - postgres
      - none
  package_manager:
    type: select
    default: pnpm
    options:
      - pnpm
      - npm
      - yarn
  docker:
    type: boolean
    default: true

steps:
  - id: web
    stage: scaffold
    type: exec
    command: pnpm
    args:
      - create
      - next-app
      - apps/web
    skip_if:
      path_exists: apps/web
  - id: docker
    stage: configure
    type: template
    source: templates/docker-compose.yml.tmpl
    destination: docker-compose.yml
    when:
      variable: docker
      equals: true

skills:
  bundled:
    - base/code-review
    - base/testing
    - fastify/api
    - nextjs/conventions
  external:
    - installer: impeccable
    - installer: tech-leads-club
      skills:
        - tlc-spec-driven
        - security-best-practices

agents:
  bundled:
    - architect
    - reviewer
    - test-writer

external_installers:
  impeccable:
    runtime: npx
    package:
      name: impeccable
      version: latest
    install:
      args:
        - install
        - --scope=project
    update:
      args:
        - update
    check:
      args:
        - check
    network: true
  tech-leads-club:
    runtime: npx
    package:
      name: "@tech-leads-club/agent-skills"
      version: latest
    network: true
