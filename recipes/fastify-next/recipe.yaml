version: 1

name: fastify-next
description: Fastify API + Next.js monorepo

requirements:
  - command: git
  - command: node
    version: ">=24"
  - command: pnpm
    when:
      variable: package_manager
      equals: pnpm

variables:
  database:
    type: select
    default: postgres
    options:
      - postgres
      - none
  package_manager:
    type: select
    default: pnpm
    options:
      - pnpm
      - npm
      - yarn
  docker:
    type: boolean
    default: true

steps:
  - id: api-dir
    stage: scaffold
    type: mkdir
    path: apps/api
  - id: web
    stage: scaffold
    type: exec
    command: pnpm
    args:
      - create
      - next-app
      - apps/web
      - --yes
    skip_if:
      path_exists: apps/web
  - id: docker
    stage: configure
    type: template
    source: templates/docker-compose.yml.tmpl
    destination: docker-compose.yml
    when:
      variable: docker
      equals: true
  - id: ready
    type: message
    text: "Fastify-next monorepo scaffolded."

skills:
  bundled:
    - base/code-review
    - fastify/api
    - nextjs/conventions

agents:
  bundled:
    - architect
    - reviewer
    - test-writer
